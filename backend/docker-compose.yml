services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: terratrack
      POSTGRES_USER: terratrack
      POSTGRES_PASSWORD: terratrack_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/init_postgis.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terratrack -d terratrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./app:/app/app

volumes:
  pgdata:

